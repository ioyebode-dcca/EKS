global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['jenkins:8080']

  - job_name: 'sonarqube'
    metrics_path: '/api/monitoring/metrics'
    basic_auth:
      username: 'admin'
      password_file: /etc/prometheus/sonarqube_password
    static_configs:
      - targets: ['sonarqube:9000']
